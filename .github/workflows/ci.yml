name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '18'

jobs:
  test-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --include=optional

      - name: Build Frontend Assets
        run: |
          cd frontend
          npm run build

      - name: Go Mod Download
        run: go mod download

      - name: Go Build Check
        run: go build -v ./...

      - name: Go Test
        run: go test -v ./...

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: |
          cd frontend
          npm install --include=optional

      - name: Build Frontend
        run: |
          cd frontend
          npm run build
