name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '18'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Wails v3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Windows
        run: wails3 build -platform windows/amd64 -ldflags "-H windowsgui"

      - name: Package Windows
        run: |
          cd build\bin
          7z a ..\..\magic-frpc-windows-amd64.zip magic-frpc.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: magic-frpc-windows-amd64.zip

  build-darwin-amd64:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Wails v3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build macOS (Intel)
        run: wails3 build -platform darwin/amd64

      - name: Package macOS
        run: tar -czf magic-frpc-darwin-amd64.tar.gz -C build/bin magic-frpc.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-amd64
          path: magic-frpc-darwin-amd64.tar.gz

  build-darwin-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Wails v3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build macOS (Apple Silicon)
        run: wails3 build -platform darwin/arm64

      - name: Package macOS
        run: tar -czf magic-frpc-darwin-arm64.tar.gz -C build/bin magic-frpc.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64
          path: magic-frpc-darwin-arm64.tar.gz

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Wails v3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Linux
        run: wails3 build -platform linux/amd64

      - name: Package Linux
        run: tar -czf magic-frpc-linux-amd64.tar.gz -C build/bin magic-frpc

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: magic-frpc-linux-amd64.tar.gz

  release:
    needs: [build-windows, build-darwin-amd64, build-darwin-arm64, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get Version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Magic FRPc ${{ steps.version.outputs.VERSION }}
          body: |
            ## Magic FRPc ${{ steps.version.outputs.VERSION }}

            ### 下载

            | 平台 | 文件 |
            |------|------|
            | Windows (64-bit) | `magic-frpc-windows-amd64.zip` |
            | macOS (Intel) | `magic-frpc-darwin-amd64.tar.gz` |
            | macOS (Apple Silicon) | `magic-frpc-darwin-arm64.tar.gz` |
            | Linux (64-bit) | `magic-frpc-linux-amd64.tar.gz` |

            ### 更新内容

            查看 [CHANGELOG.md](CHANGELOG.md) 了解详细更新内容。
          files: |
            artifacts/windows-amd64/magic-frpc-windows-amd64.zip
            artifacts/darwin-amd64/magic-frpc-darwin-amd64.tar.gz
            artifacts/darwin-arm64/magic-frpc-darwin-arm64.tar.gz
            artifacts/linux-amd64/magic-frpc-linux-amd64.tar.gz
          draft: false
          prerelease: false
