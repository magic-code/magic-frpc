# Magic FRPc 项目配置
version: '3'

info:
  companyName: "Magic FRPc"
  productName: "Magic FRPc"
  productIdentifier: "com.magic-frpc.gui"
  description: "跨平台 frpc GUI 管理客户端"
  copyright: "(c) 2026, Magic FRPc"
  comments: "Magic FRPc GUI Client"
  version: "0.1.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

fileAssociations: []

other: []
